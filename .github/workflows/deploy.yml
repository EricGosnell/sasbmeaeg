name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/sasbmeaeg/yard

            git pull

            cd frontend
            npm install
            npm run build

            cd ../backend
            npm install
            npm run build

            pm2 restart yard-backend || pm2 start npm --name yard-backend -- start